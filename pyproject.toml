[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-ai-agent"
version = "0.1.0"
description = "Human-in-the-Loop Multi-AI Agent Diagnostics Platform for HPC/AI Clusters (offline POC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    # Workflow orchestration only; pinned exactly because the API moves quickly.
    "agent-framework-core==1.22.0",
    "fastapi==0.156.4",
    "uvicorn==0.54.0",
    # Optional Claude provider (MODEL_PROVIDER=anthropic); pinned to a release at least two weeks old.
    "anthropic==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# Upstream notice from starlette's TestClient about httpx; not related to this project.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

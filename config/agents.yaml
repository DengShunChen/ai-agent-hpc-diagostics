# Per-agent tool scopes, loaded by hpc_agent.config.load_agent_tool_scopes().
# A scope can only narrow access: tools must also be registered in the Tool Gateway
# allowlist (src/hpc_agent/tools/gateway.py). Agents not listed here get no tools.
# Knowledge tools return reference material only; it never counts as evidence.
agents:
  triage-agent:
    domain: triage
    tools: []                   # works from the incident only
  storage-agent:
    domain: storage
    tools: [get_filesystem_usage, get_ost_usage, search_sop, search_incident_history, search_manual]
  scheduler-agent:
    domain: scheduler
    tools: [get_job_status, get_node_status, search_sop, search_incident_history, search_manual]
  network-agent:
    domain: network
    tools: [get_network_status, search_sop, search_incident_history, search_manual]
  gpu-agent:
    domain: gpu
    tools: [get_gpu_health, search_sop, search_incident_history, search_manual]
  rca-coordinator:
    domain: coordination
    tools: []                   # correlates agent output only
  remediation-agent:
    domain: remediation
    tools: []                   # proposes playbook actions from the RCA only; executes nothing

# Novel-fault development scenario (Slurm): a fault the rule-based agents do not encode. Used while
# building Phases 2-4, so it is not an independent test; a novel blind set (simulate --faults novel) is.
scenario_id: SIM-NOV-001
seed: 3001
platform: slurm-x86
fault: slow_node_walltime
distractors: [old_correctable_ecc, drained_other_node]
description: "One node throttled; the job hits its time limit."
